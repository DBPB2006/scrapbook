<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Memory Details - MemoryBook</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/output.css">
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        html, body { font-family: 'Quicksand', sans-serif; }
        .font-kalam { font-family: 'Kalam', cursive !important; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .delete-btn {
            background: #b91c1c; color: #fff; border: none; border-radius: 12px;
            padding: 10px 22px; font-size: 1rem; font-weight: bold;
            box-shadow: 0 2px 8px rgba(185,28,28,0.15); display: flex; align-items: center;
            gap: 8px; cursor: pointer; transition: background 0.2s, box-shadow 0.2s;
        }
        .delete-btn:hover { background: #7f1d1d; box-shadow: 0 4px 16px rgba(185,28,28,0.25); }
        .edit-btn {
            background: #8B7EC8; color: #fff; border: none; border-radius: 12px;
            padding: 10px 22px; font-size: 1rem; font-weight: bold;
            box-shadow: 0 2px 8px rgba(139,126,200,0.15); display: flex; align-items: center;
            gap: 8px; cursor: pointer; transition: background 0.2s, box-shadow 0.2s;
        }
        .edit-btn:hover { background: #7A6BB5; box-shadow: 0 4px 16px rgba(139,126,200,0.25); }
        .blobs-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #fafafa; }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 via-blue-50 to-pink-50 min-h-screen overflow-x-hidden flex flex-col">
    <div class="blobs-bg"></div>
    <header class="bg-white/80 backdrop-blur-md border-b border-[#E8E3F5] sticky top-0 z-50 shadow-sm">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
            <a href="/dashboard.html" class="text-[#8B7EC8] font-semibold hover:underline">&larr; Back to Dashboard</a>
            <button onclick="logout()" class="text-[#F48498] hover:text-[#8B7EC8] font-medium">Logout</button>
        </nav>
    </header>
    <div class="flex flex-1">
        <aside class="w-24 flex flex-col items-center py-6 px-2 z-10 bg-white/80 rounded-tr-3xl rounded-br-3xl shadow-lg border-r border-[#e0e0f0]">
            <button id="orderToggleBtn" class="mb-3 text-[10px] font-bold px-2 py-1 rounded-full bg-[#E8E3F5] text-[#8B7EC8] hover:bg-[#D8D0F0] transition flex items-center gap-1 shadow-sm" title="Toggle chronological order">
                <i class="fas fa-clock"></i><span id="orderLabel">Oldest</span>
            </button>
            <a id="prevLink" href="#" class="mb-4 flex items-center justify-center w-10 h-10 rounded-full bg-[#8B7EC8] text-white hover:bg-[#6B6B7D] transition opacity-40 pointer-events-none" title="Previous Memory">
                <i class="fas fa-chevron-up"></i>
            </a>
            <div id="timelineContainer" class="flex flex-col gap-4 items-center max-h-[55vh] overflow-y-auto scrollbar-hide">
                <!-- Populated dynamically -->
            </div>
            <a id="nextLink" href="#" class="mt-4 flex items-center justify-center w-10 h-10 rounded-full bg-[#8B7EC8] text-white hover:bg-[#6B6B7D] transition opacity-40 pointer-events-none" title="Next Memory">
                <i class="fas fa-chevron-down"></i>
            </a>
        </aside>
        
        <main class="flex-1 flex flex-col items-center justify-center px-2 py-8">
            <div id="contentWrapper" class="w-full max-w-4xl mx-auto flex flex-col gap-8 items-center hidden">
                <div class="w-full flex flex-col md:flex-row gap-8">
                    <section class="flex-1 bg-white/90 rounded-3xl shadow-2xl p-8 flex flex-col gap-4 min-h-[520px]">
                        <div class="flex items-center gap-4 mb-2">
                            <div class="w-16 h-16 rounded-full bg-[#A8C8EC] flex items-center justify-center text-2xl font-bold text-white border-4 border-[#8B7EC8]">
                                <i class="fa-solid fa-book-open"></i>
                            </div>
                            <div>
                                <h1 id="memTitle" class="text-3xl font-bold text-gray-900 leading-tight mb-1"></h1>
                                <div id="memDate" class="flex items-center text-gray-500 text-base mb-1">
                                    <i class="fa-regular fa-calendar mr-2"></i><span></span>
                                </div>
                                <div id="memMood" class="flex items-center text-gray-500 text-base mb-1 hidden">
                                    <i class="fas fa-smile mr-2"></i><span></span>
                                </div>
                                <div id="memLocation" class="flex items-center text-gray-500 text-base mb-1 hidden">
                                    <i class="fa-solid fa-location-dot mr-2"></i><a href="#" target="_blank" class="text-[#8B7EC8] hover:underline"></a>
                                </div>
                            </div>
                        </div>
                        <div class="flex justify-end gap-3 mb-2">
                            <button id="editBtn" class="edit-btn"><i class="fas fa-edit"></i> Edit Memory</button>
                            <button id="deleteBtn" class="delete-btn"><i class="fas fa-trash"></i> Delete Memory</button>
                        </div>
                        <div class="mb-2">
                            <span class="font-semibold text-gray-700">Description</span>
                            <div id="memDesc" class="text-gray-700 mt-1 text-base leading-relaxed bg-[#F5F3FB] rounded-xl p-4 border border-[#E8E3F5]"></div>
                        </div>
                        <div id="memTags" class="flex flex-wrap gap-2 mb-2 hidden"></div>
                        <div class="text-gray-600 mb-2"><strong>Friends included:</strong> <span id="memFriends">No friends included</span></div>
                    </section>
                    
                    <section class="flex-1 bg-white rounded-3xl shadow-lg p-8 flex flex-col gap-6 min-h-[520px]">
                        <h2 class="text-xl font-semibold text-[#8B7EC8] mb-2 flex items-center gap-2"><i class="fa-regular fa-images"></i> Memory Media</h2>
                        <div class="w-full flex flex-col items-center mb-6">
                            <div id="mediaGallery" class="media-gallery w-full flex flex-col items-center">
                                <!-- Slides populated here -->
                            </div>
                            <div class="flex gap-4 mt-4 hidden" id="galleryControls">
                                <button id="prevSlide" class="px-3 py-1 bg-[#ede9fe] text-[#7c3aed] rounded-lg font-semibold"><i class="fa fa-chevron-left"></i> Prev</button>
                                <button id="nextSlide" class="px-3 py-1 bg-[#ede9fe] text-[#7c3aed] rounded-lg font-semibold">Next <i class="fa fa-chevron-right"></i></button>
                            </div>
                        </div>
                    </section>
                </div>
                <section class="w-full bg-white/80 rounded-2xl shadow-lg p-6 mt-6">
                    <h2 class="text-lg font-semibold text-[#8B7EC8] mb-2 flex items-center gap-2"><i class="fa fa-info-circle"></i> Memory Details</h2>
                    <dl id="extraDetails" class="divide-y divide-[#E8E3F5]"></dl>
                </section>
                <div class="mt-4">
                    <a href="/dashboard.html" class="inline-block px-6 py-2 bg-[#8B7EC8] text-white rounded-xl hover:bg-[#6BCB77] transition">Back to Dashboard</a>
                </div>
            </div>
            <div id="loading" class="text-gray-500 mt-10 text-xl">Loading...</div>
        </main>
    </div>

    <!-- Edit Memory Modal -->
    <div id="editModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl max-w-xl w-full p-8 max-h-[90vh] overflow-y-auto border border-[#E8E3F5]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-[#2D2A3D] font-kalam flex items-center gap-2"><i class="fas fa-edit text-[#8B7EC8]"></i> Edit Memory</h2>
                <button type="button" id="closeEditModal" class="text-gray-400 hover:text-gray-600 text-xl"><i class="fas fa-times"></i></button>
            </div>
            <form id="editMemoryForm" class="space-y-4">
                <div id="editFeedback" class="hidden p-3 rounded-xl text-sm"></div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Title *</label>
                    <input type="text" id="editTitle" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#8B7EC8] focus:border-transparent outline-none" />
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Date *</label>
                        <input type="date" id="editDate" required class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#8B7EC8] focus:border-transparent outline-none" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Mood</label>
                        <select id="editMood" class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#8B7EC8] focus:border-transparent outline-none">
                            <option value="">Select mood...</option>
                            <option value="happy">Happy 😊</option>
                            <option value="loved">Loved 🥰</option>
                            <option value="excited">Excited 🤩</option>
                            <option value="nostalgic">Nostalgic 🥺</option>
                            <option value="peaceful">Peaceful 😌</option>
                            <option value="grateful">Grateful 🙏</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Location</label>
                    <input type="text" id="editLocation" class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#8B7EC8] focus:border-transparent outline-none" placeholder="City, Place or Coordinates" />
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Tags (comma-separated)</label>
                    <input type="text" id="editTags" class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#8B7EC8] focus:border-transparent outline-none" placeholder="vacation, family, friends" />
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Description</label>
                    <textarea id="editDescription" rows="4" class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#8B7EC8] focus:border-transparent outline-none" placeholder="What made this memory special?"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Add More Media (Photos, Video, Audio)</label>
                    <input type="file" id="editMediaInput" multiple accept="image/*,video/*,audio/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-[#E8E3F5] file:text-[#8B7EC8] hover:file:bg-[#D8D0F0]" />
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
                    <button type="button" id="cancelEditBtn" class="px-5 py-2 rounded-xl border border-gray-300 text-gray-700 font-semibold hover:bg-gray-50 transition">Cancel</button>
                    <button type="submit" id="saveEditBtn" class="px-6 py-2 rounded-xl bg-[#8B7EC8] text-white font-semibold hover:bg-[#7A6BB5] transition shadow flex items-center gap-2">
                        <span id="saveEditText">Save Changes</span>
                        <i id="saveEditSpinner" class="fas fa-spinner fa-spin hidden"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/app.js"></script>
    <script src="/js/client_memory_details.js"></script>
</body>
</html>
