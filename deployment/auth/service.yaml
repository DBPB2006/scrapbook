apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: memorybook
  labels:
    app: auth-service
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: memorybook
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
  - name: http
    port: 3001
    targetPort: 3001
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service-metrics
  namespace: memorybook
  labels:
    app: auth-service
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: memorybook
spec:
  clusterIP: None
  selector:
    app: auth-service
  ports:
  - name: metrics
    port: 3001
    targetPort: 3001
    protocol: TCP

