apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: scrapbook
  labels:
    app.kubernetes.io/part-of: scrapbook
data:
  NODE_ENV: "production"
  NODE_OPTIONS: "--max-old-space-size=160"
  AWS_REGION: "ap-south-1"
  # Populated during Jenkins deployment from Terraform output media_bucket_name
  AWS_S3_BUCKET: "<MEDIA_S3_BUCKET>"
  MONGODB_DATABASE: "scrapbook"
  MONGODB_AUTH_SOURCE: "scrapbook"
  MONGODB_POOL_MAX: "10"

