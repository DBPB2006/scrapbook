apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: memorybook
  labels:
    app: auth-service
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: memorybook
data:
  PORT: "3001"
  NODE_ENV: "production"
  AWS_REGION: "ap-south-1"
  AWS_S3_BUCKET: "scrapbook-media"
  MONGODB_DATABASE: "memorybook"
  MEMORIES_SERVICE_URL: "http://memories-service:3002"
  SHARING_SERVICE_URL: "http://sharing-service:3004"

