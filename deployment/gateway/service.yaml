apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: scrapbook
  labels:
    app: gateway-service
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: scrapbook
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
  - name: http
    port: 3090
    targetPort: 3090
    nodePort: 30090
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service-metrics
  namespace: scrapbook
  labels:
    app: gateway-service
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: scrapbook
spec:
  clusterIP: None
  selector:
    app: gateway-service
  ports:
  - name: metrics
    port: 3091
    targetPort: 3091
    protocol: TCP

