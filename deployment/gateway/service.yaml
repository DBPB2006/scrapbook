apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: memorybook
  labels:
    app: gateway-service
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: memorybook
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
  - name: http
    port: 3090
    targetPort: 3090
    nodePort: 30090
    protocol: TCP

