apiVersion: apps/v1
kind: Deployment
metadata:
  name: memories-service
  namespace: memorybook
  labels:
    app: memories-service
    app.kubernetes.io/name: memories-service
    app.kubernetes.io/part-of: memorybook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memories-service
  template:
    metadata:
      labels:
        app: memories-service
        app.kubernetes.io/name: memories-service
        app.kubernetes.io/part-of: memorybook
    spec:
      containers:
      - name: memories-service
        image: scrapbook-memories:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3002
          protocol: TCP
        env:
        - name: PORT
          value: "3002"
        - name: NODE_ENV
          value: "production"
        - name: AWS_REGION
          value: "ap-south-1"
        - name: AWS_S3_BUCKET
          value: "scrapbook-media"
        - name: MONGODB_DATABASE
          value: "memorybook"
        envFrom:
        - secretRef:
            name: app-secrets
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

