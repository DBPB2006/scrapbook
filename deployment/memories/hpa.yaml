apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scrapbook-memories-hpa
  namespace: scrapbook
  labels:
    app: memories-service
    app.kubernetes.io/name: memories-service
    app.kubernetes.io/part-of: scrapbook
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scrapbook-memories
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120

