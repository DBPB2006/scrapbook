apiVersion: apps/v1
kind: Deployment
metadata:
  name: memories-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memories
  template:
    metadata:
      labels:
        app: memories
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
      - name: memories
        image: 929140636859.dkr.ecr.ap-south-1.amazonaws.com/scrapbook-memories:latest
        ports:
        - containerPort: 3002
        envFrom:
        - configMapRef:
            name: memories-config
        - secretRef:
            name: scrapbook-secrets
        volumeMounts:
        - name: storage
          mountPath: /data/storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: storage-pvc
