apiVersion: v1
kind: Service
metadata:
  name: memories-service
  namespace: scrapbook
  labels:
    app: memories-service
    app.kubernetes.io/name: memories-service
    app.kubernetes.io/part-of: scrapbook
spec:
  type: ClusterIP
  selector:
    app: memories-service
  ports:
  - name: http
    port: 3002
    targetPort: 3002
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: memories-service-metrics
  namespace: scrapbook
  labels:
    app: memories-service
    app.kubernetes.io/name: memories-service
    app.kubernetes.io/part-of: scrapbook
spec:
  clusterIP: None
  selector:
    app: memories-service
  ports:
  - name: metrics
    port: 3002
    targetPort: 3002
    protocol: TCP

