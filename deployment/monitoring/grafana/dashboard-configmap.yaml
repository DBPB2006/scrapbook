apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: scrapbook
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: scrapbook
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Scrapbook'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/dashboards
  scrapbook.json: |
    {
      "uid": "scrapbook-overview",
      "title": "Scrapbook Overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Active Service Pods (HPA Visibility)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (job) (up{job=~\"auth-service|memories-service|social-service|sharing-service|gateway-service\"})",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Service CPU Utilization (%)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (job) (rate(process_cpu_seconds_total{job=~\"auth-service|memories-service|social-service|sharing-service|gateway-service\"}[1m])) * 100",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "HTTP Request Rate (req/s)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (job) (rate(http_requests_total[1m]))",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "HTTP Error Rate (4xx/5xx req/s)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (job) (rate(http_errors_total[1m]))",
              "legendFormat": "{{job}}"
            }
          ]
        }
      ]
    }

