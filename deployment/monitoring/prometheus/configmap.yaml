apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: scrapbook
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: scrapbook
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'auth-service'
        metrics_path: /metrics
        dns_sd_configs:
          - names:
              - 'auth-service-metrics.scrapbook.svc.cluster.local'
            type: 'A'
            port: 3001
            refresh_interval: 15s

      - job_name: 'memories-service'
        metrics_path: /metrics
        dns_sd_configs:
          - names:
              - 'memories-service-metrics.scrapbook.svc.cluster.local'
            type: 'A'
            port: 3002
            refresh_interval: 15s

      - job_name: 'social-service'
        metrics_path: /metrics
        dns_sd_configs:
          - names:
              - 'social-service-metrics.scrapbook.svc.cluster.local'
            type: 'A'
            port: 3003
            refresh_interval: 15s

      - job_name: 'sharing-service'
        metrics_path: /metrics
        static_configs:
          - targets: ['sharing-service:3004']

      - job_name: 'gateway-service'
        metrics_path: /metrics
        dns_sd_configs:
          - names:
              - 'gateway-service-metrics.scrapbook.svc.cluster.local'
            type: 'A'
            port: 3091
            refresh_interval: 15s

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

