apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: scrapbook
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: scrapbook
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - '/etc/prometheus/alerting_rules.yml'

    scrape_configs:
      - job_name: 'auth-service'
        metrics_path: /metrics
        dns_sd_configs:
          - names:
              - 'auth-service-metrics.scrapbook.svc.cluster.local'
            type: 'A'
            port: 3001
            refresh_interval: 15s

      - job_name: 'memories-service'
        metrics_path: /metrics
        dns_sd_configs:
          - names:
              - 'memories-service-metrics.scrapbook.svc.cluster.local'
            type: 'A'
            port: 3002
            refresh_interval: 15s

      - job_name: 'social-service'
        metrics_path: /metrics
        dns_sd_configs:
          - names:
              - 'social-service-metrics.scrapbook.svc.cluster.local'
            type: 'A'
            port: 3003
            refresh_interval: 15s

      - job_name: 'sharing-service'
        metrics_path: /metrics
        dns_sd_configs:
          - names:
              - 'sharing-service-metrics.scrapbook.svc.cluster.local'
            type: 'A'
            port: 3004
            refresh_interval: 15s

      - job_name: 'gateway-service'
        metrics_path: /metrics
        dns_sd_configs:
          - names:
              - 'gateway-service-metrics.scrapbook.svc.cluster.local'
            type: 'A'
            port: 3091
            refresh_interval: 15s

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

  alerting_rules.yml: |
    groups:
      - name: scrapbook-condition-alerts
        rules:
          # Alert: Pod Failure / Unhealthy Service
          - alert: ServicePodDown
            expr: up{job=~"auth-service|memories-service|social-service|sharing-service|gateway-service"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Microservice {{ $labels.job }} is DOWN"
              description: "Microservice {{ $labels.job }} (instance {{ $labels.instance }}) has failed or is unreachable for over 1 minute."

          # Alert: High Load / CPU Saturation
          - alert: HighCpuUtilization
            expr: sum by (job) (rate(process_cpu_seconds_total{job=~".*-service"}[1m])) * 100 > 75
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High CPU on {{ $labels.job }}"
              description: "{{ $labels.job }} CPU utilization exceeds 75% for 2 minutes (nearing HPA scaling threshold)."

          # Alert: Memory Usage Saturation
          - alert: HighMemoryUsage
            expr: sum by (job) (process_resident_memory_bytes{job=~".*-service"}) / (1024 * 1024) > 150
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "High Memory usage on {{ $labels.job }}"
              description: "{{ $labels.job }} memory footprint exceeds 150MB for 3 minutes."

          # Alert: Service Error Rate Spike
          - alert: HighHttpErrorRate
            expr: sum by (job) (rate(http_errors_total[1m])) > 0.5
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High HTTP error rate on {{ $labels.job }}"
              description: "{{ $labels.job }} is serving more than 0.5 errors/second."

          # Alert: Rate Limiting Active
          - alert: RateLimitExceeded
            expr: sum(rate(http_requests_total{code="429"}[1m])) > 0.1
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Gateway rate limiting triggered"
              description: "API Gateway is returning HTTP 429 to rate-limited clients."

          # Reliability: Frequent Pod Crash Detection
          - alert: FrequentPodRestarts
            expr: changes(process_start_time_seconds{job=~".*-service"}[15m]) > 2
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Frequent restarts on {{ $labels.job }}"
              description: "Pod for {{ $labels.job }} has restarted more than twice in the past 15 minutes."

          # Security: Brute-Force / Spike in Login Failures
          - alert: HighFailedLogins
            expr: rate(failed_logins_total[2m]) > 0.2
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Suspicious login failure spike"
              description: "Unusually high rate of failed logins detected on auth-service."

