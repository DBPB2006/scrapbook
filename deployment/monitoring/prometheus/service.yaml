apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: scrapbook
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: scrapbook
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    nodePort: 30091
    protocol: TCP

