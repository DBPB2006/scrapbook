apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |-
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'auth-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['auth-service:3001']

      - job_name: 'gateway-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['gateway-service:3090']

      - job_name: 'memories-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['memories-service:3002']

      - job_name: 'social-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['social-service:3003']

      - job_name: 'sharing-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['sharing-service:3004']

      - job_name: 'ds-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['ds-service:3005']
