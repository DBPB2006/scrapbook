apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrapbook-sharing
  namespace: scrapbook
  labels:
    app: sharing-service
    app.kubernetes.io/name: sharing-service
    app.kubernetes.io/part-of: scrapbook
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: sharing-service
  template:
    metadata:
      labels:
        app: sharing-service
        app.kubernetes.io/name: sharing-service
        app.kubernetes.io/part-of: scrapbook
    spec:
      containers:
      - name: scrapbook-sharing
        image: "<AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/scrapbook-sharing:<IMAGE_TAG>"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3004
          protocol: TCP
        env:
        - name: PORT
          value: "3004"
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:3001"
        - name: MEMORIES_SERVICE_URL
          value: "http://memories-service:3002"
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        resources:
          requests:
            cpu: 40m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 224Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3004
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

