apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: social-service-hpa
  namespace: memorybook
  labels:
    app: social-service
    app.kubernetes.io/name: social-service
    app.kubernetes.io/part-of: memorybook
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: social-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60

