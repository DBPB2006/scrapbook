apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs-hostpath-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ebs-hostpath
  hostPath:
    path: /data/storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-hostpath
  resources:
    requests:
      storage: 50Gi
