

services:
  gateway-service:
    build: ./gateway-service
    container_name: scrapbook_gateway
    restart: always
    ports:
      - "3090:3090"
    environment:
      - PORT=3090
      - UPLOAD_DIR=/usr/src/app/uploads/
      - AUTH_SERVICE_URL=http://auth-service:3001
      - MEMORIES_SERVICE_URL=http://memories-service:3002
      - SOCIAL_SERVICE_URL=http://social-service:3003
      - SHARING_SERVICE_URL=http://sharing-service:3004
      - STORAGE_PATH=/data/storage
    volumes:
      - ./client:/usr/src/app/pages
      - ./storage:/data/storage
    depends_on:
      - auth-service
      - memories-service
      - social-service
      - sharing-service
      - ds-service

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: scrapbook_auth
    restart: always
    environment:
      - PORT=3001
      - UPLOAD_DIR=/usr/src/app/uploads/
      - DS_SERVICE_URL=http://ds-service:3005
      - MEMORIES_SERVICE_URL=http://memories-service:3002
      - SHARING_SERVICE_URL=http://sharing-service:3004
      - AWS_S3_BUCKET=memorybook-media
      - AWS_REGION=ap-south-1
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - STORAGE_PATH=/data/storage
    volumes:
      - ./storage:/data/storage

  memories-service:
    build:
      context: .
      dockerfile: memories-service/Dockerfile
    container_name: scrapbook_memories
    restart: always
    environment:
      - PORT=3002
      - UPLOAD_DIR=/usr/src/app/uploads/
      - AWS_S3_BUCKET=memorybook-media
      - AWS_REGION=ap-south-1
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - STORAGE_PATH=/data/storage
    volumes:
      - ./storage:/data/storage

  social-service:
    build:
      context: .
      dockerfile: social-service/Dockerfile
    container_name: scrapbook_social
    restart: always
    environment:
      - PORT=3003
      - UPLOAD_DIR=/usr/src/app/uploads/friends/
      - AUTH_SERVICE_URL=http://auth-service:3001
      - MEMORIES_SERVICE_URL=http://memories-service:3002
      - DS_SERVICE_URL=http://ds-service:3005
      - AWS_S3_BUCKET=memorybook-media
      - AWS_REGION=ap-south-1
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - STORAGE_PATH=/data/storage
    volumes:
      - ./storage:/data/storage

  sharing-service:
    build:
      context: .
      dockerfile: sharing-service/Dockerfile
    container_name: scrapbook_sharing
    restart: always
    environment:
      - PORT=3004
      - UPLOAD_DIR=/usr/src/app/uploads/
      - DS_SERVICE_URL=http://ds-service:3005
      - AUTH_SERVICE_URL=http://auth-service:3001
      - MEMORIES_SERVICE_URL=http://memories-service:3002
      - AWS_S3_BUCKET=memorybook-media
      - AWS_REGION=ap-south-1
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - STORAGE_PATH=/data/storage
    volumes:
      - ./storage:/data/storage

  ds-service:
    build: ./ds-service
    container_name: scrapbook_ds
    restart: always
    environment:
      - PORT=3005
      - STORAGE_PATH=/data/storage
    volumes:
      - ./storage:/data/storage
